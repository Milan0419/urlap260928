<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzarendelés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Pizzarendelés</h2>

<form action="#" method="get">

  <fieldset>
    <legend>Kapcsolat</legend>
    <p>
      <label for="nev">Név *</label><br>
      <input type="text" id="nev" name="nev" required>
    </p>
    <p>
      <label for="tel">Telefon *</label><br>
      <input type="tel" id="tel" name="telefon"
             placeholder="+36 30 123 4567" required>
    </p>
    <p>
      <label for="email">E-mail *</label><br>
      <input type="email" id="email" name="email"
             placeholder="pelda@pelda.com" required>
    </p>
  </fieldset>

  <fieldset>
    <legend>A pizza</legend>
    <p>
      <label for="fajta">Fajta *</label>
      <select id="fajta" name="fajta" required>
        <option value="">-- válassz --</option>
        <option value="margherita">Margherita</option>
        <option value="sonkas">Sonkás</option>
        <option value="negysajtos">Négysajtos</option>
        <option value="magyaros">Magyaros</option>
        <option value="hawaii">Hawaii</option>
        <option value="baconos">Baconos</option>
        <option value="sonkukor">Sonkás-Kukoricás</option>
        <option value="sonkagomba">Sonkás-Gombás</option>
        <option value="songoku">Sonkás-Gombás-Kukoricás</option>        
        <option value="kolbaszos">Kolbászos</option>
        <option value="tarjas">Tarjás</option>
      </select>
    </p>

    <p><strong>Méret:</strong></p>
    <p>
      <input type="radio" id="m1" name="meret"
             value="26" checked>
      <label for="m1">26 cm</label>

      <input type="radio" id="m2" name="meret"
             value="32">
      <label for="m2">32 cm</label>

      <input type="radio" id="m3" name="meret"
             value="50">
      <label for="m3">50 cm</label>
    </p>

    <p><strong>Extra feltét:</strong></p>
    <p>
      <input type="checkbox" id="f1" name="extra[]" value="sajt">
      <label for="f1">Extra sajt</label>

      <input type="checkbox" id="f2" name="extra[]" value="gomba">
      <label for="f2">Gomba</label>

      <input type="checkbox" id="f3" name="extra[]" value="kukorica">
      <label for="f3">Kukorica</label>

      <input type="checkbox" id="f4" name="extra[]" value="sonka">
      <label for="f4">Sonka</label>

      <input type="checkbox" id="f5" name="extra[]" value="szalami">
      <label for="f5">Szalámi</label>

      <!-- Új extra feltétek -->
      <input type="checkbox" id="f6" name="extra[]" value="bacon">
      <label for="f6">Bacon</label>

      <input type="checkbox" id="f7" name="extra[]" value="olivabogyo">
      <label for="f7">Olívabogyó</label>

      <input type="checkbox" id="f8" name="extra[]" value="jalapeno">
      <label for="f8">Jalapeño (csípős)</label>

      <input type="checkbox" id="f9" name="extra[]" value="ananasz">
      <label for="f9">Ananász</label>

      <input type="checkbox" id="f10" name="extra[]" value="tejfol">
      <label for="f10">Tejföl</label>
    </p>

    <p>
      <label for="db">Darab *</label>
      <input type="number" id="db" name="darab"
             value="1" min="1" max="10" required>
    </p>
  </fieldset>

  <p>
    <label for="megj">Megjegyzés</label><br>
    <textarea id="megj" name="megjegyzes"
              rows="3" cols="34" placeholder="Itt írd le a megjegyzésed..."></textarea>
  </p>

  <p>
    <input type="checkbox" id="aszf" name="aszf"
           value="elfogadva" required>
    <label for="aszf">Elfogadom a <a href="feltetelek.html" target="_blank">feltételeket</a> *</label>
  </p>

  <button type="submit">Megrendelem</button>
</form>
</body>
</html>
